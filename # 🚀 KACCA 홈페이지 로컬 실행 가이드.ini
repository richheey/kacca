# 🚀 KACCA 홈페이지 로컬 실행 가이드

이 프로젝트는 **React**와 **Tailwind CSS**, 그리고 **Firebase**를 기반으로 작성되었습니다. 로컬 환경에서 실행하려면 아래의 순서대로 진행해 주세요.

## 1. 사전 준비
컴퓨터에 **Node.js**가 설치되어 있어야 합니다. 
설치되어 있지 않다면 [Node.js 공식 홈페이지](https://nodejs.org/)에서 LTS 버전을 다운로드하여 설치해 주세요.

---

## 2. 프로젝트 생성 및 패키지 설치
터미널(또는 명령 프롬프트)을 열고 실행할 폴더로 이동한 뒤, 아래 명령어들을 순서대로 복사해서 실행하세요.

```bash
# 1. Vite를 사용하여 새로운 React 프로젝트 생성 (프로젝트명: kacca-app)
npm create vite@latest kacca-app -- --template react

# 2. 생성된 프로젝트 폴더로 이동
cd kacca-app

# 3. 기본 패키지 설치
npm install

# 4. Firebase 및 Tailwind CSS 관련 패키지 설치
npm install firebase
npm install -D tailwindcss postcss autoprefixer

# 5. Tailwind 설정 파일 생성
npx tailwindcss init -p
```

---

## 3. Tailwind CSS 설정
Tailwind가 React 파일에서 정상적으로 작동하도록 설정을 변경해야 합니다.

**1) `tailwind.config.js` 파일 수정**
프로젝트 루트 폴더에 생성된 `tailwind.config.js` 파일을 열고 `content` 부분을 아래와 같이 수정합니다.
```javascript
/** @type {import('tailwindcss').Config} */
export default {
  content: [
    "./index.html",
    "./src/**/*.{js,ts,jsx,tsx}", // 이 부분을 반드시 추가하세요!
  ],
  theme: {
    extend: {},
  },
  plugins: [],
}
```

**2) `src/index.css` 파일 수정**
`src` 폴더 안의 `index.css` 파일을 열고, 기존에 있던 내용을 **모두 지운 뒤** 아래 세 줄만 붙여넣습니다.
```css
@tailwind base;
@tailwind components;
@tailwind utilities;
```

---

## 4. 코드 적용하기 (가장 중요 ⭐)
현재 채팅창 우측 에디터에 있는 완성된 코드를 로컬 프로젝트에 적용합니다.

1. 우측 에디터의 `KaccaApp.jsx` 코드를 **전체 복사**합니다. (에디터 내 복사 버튼 활용)
2. 로컬 프로젝트의 `src` 폴더 안에 있는 **`App.jsx`** 파일을 엽니다.
3. `App.jsx` 파일 안의 기존 내용을 **모두 지우고**, 복사한 코드를 **그대로 붙여넣기** 한 후 저장합니다.

---

## 5. 실행하기
모든 준비가 끝났습니다! 터미널에서 아래 명령어를 입력하여 서버를 실행합니다.

```bash
npm run dev
```

터미널에 `http://localhost:5173` 과 같은 로컬 주소가 나타납니다. 해당 주소를 `Ctrl + 클릭` (Mac은 `Cmd + 클릭`) 하거나 인터넷 브라우저 주소창에 복사해서 붙여넣으면, 방금 만든 KACCA 홈페이지가 로컬에서 완벽하게 실행되는 것을 확인하실 수 있습니다! 🎉